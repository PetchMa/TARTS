version: 0
seed: 42  # Random seed for reproducibility across all training scripts
# Must be > 10k to ensure full coverage of all perturbation bins (SEQNUMs) when sampling.
# Each SEQNUM = unique Zernike perturbation; dataset has 10k such perturbations.
min_seqnums: 10001
adjustment_WaveNet: 10
adjustment_AlignNet: 120
refinements: 1
CROP_SIZE : 160
deg_per_pix : 0.00005555555
mm_pix : 0.01
alpha: 0.5
max_seq_len: 200
butler_repo_path: 'butler_training_fix'

# Model architecture parameters
cnn_model: 'mobilenetv4_conv_small'  # Options: mobilenetv4_conv_small, mobilenetv4_conv_medium, mobilenetv4_conv_large, mobilenetv4_hybrid_large, resnet18, resnet34, resnet50
finetune_filepath: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/simulation_pretrain_42'
finetune_filepath_train: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/simulation_pretrain_42/train/'
finetune_filepath_val: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/simulation_pretrain_42/val/'
coral_filepath: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/coral/'
coral_filepath_train: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/coral/train/'
coral_filepath_val: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/coral/val/'
coral_filepath_usdf_train: '~/train'
coral_filepath_usdf_val: '~/val'
aggregator_filepath: '/media/peterma/mnt2/peterma/research/LSST_FULL_FRAME/aggregator/'

# Optional: path to DOF table (.npy shape (N, n_dof) or .csv). If set, each sample uses a row; if unset, all samples use zero DOF.
# batoid_dof_table: '/path/to/dof_table.npy'

# AggregatorNet model parameters
aggregator_model:
  d_model: 32
  nhead: 4
  num_layers: 6
